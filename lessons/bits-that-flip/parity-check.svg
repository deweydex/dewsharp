<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="parity-check-title parity-check-desc">
<title id="parity-check-title">A parity bit catches one flipped bit, and misses two</title>
<desc id="parity-check-desc">Three rows of eight bits, each with the parity bit 1 beside it. Sent: 00001110, with three ones, which is odd, so the parity bit is 1. One bit flips: 00001010, with two ones, which is even. It was odd, so the check sees a change. Two bits flip: 00001000, with one one, which is odd. It was odd when it was sent too, so the check sees nothing.</desc>
<rect x="0" y="0" width="720" height="250" fill="#ffffff"/>
<text x="232" y="22" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">the byte</text>
<text x="380" y="22" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">parity bit</text>
<text x="108" y="53" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="end">sent</text>
