<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" role="img" aria-labelledby="monty-hall-cases-title monty-hall-cases-desc">
<title id="monty-hall-cases-title">The three places the car can be, when you pick door 1</title>
<desc id="monty-hall-cases-desc">At the top: you pick door 1. Three lines go down from it, each marked 1 in 3, to the three places the car can be. Car behind door 1: the host may open door 2 or door 3, and switching loses. Car behind door 2: the host must open door 3, and switching wins. Car behind door 3: the host must open door 2, and switching wins. Switching wins in two of the three cases.</desc>
<rect x="0" y="0" width="600" height="310" fill="#ffffff"/>
<g stroke="#000000" stroke-width="1.5" stroke-linecap="round">
<line x1="300" y1="46" x2="100" y2="100"/>
<line x1="300" y1="46" x2="300" y2="100"/>
<line x1="300" y1="46" x2="500" y2="100"/>
<line x1="100" y1="130" x2="100" y2="180"/>
<line x1="300" y1="130" x2="300" y2="180"/>
<line x1="500" y1="130" x2="500" y2="180"/>
<line x1="100" y1="210" x2="100" y2="260"/>
<line x1="300" y1="210" x2="300" y2="260"/>
<line x1="500" y1="210" x2="500" y2="260"/>
</g>
<g font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
<rect x="205" y="8" width="190" height="38" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="300" y="25" font-size="14" fill="#000000">You pick door 1</text>
<text x="300" y="40" font-size="11" fill="#555555">switching wins in 2 of these 3</text>
<rect x="176" y="64" width="44" height="17" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="198" y="77" font-size="11" fill="#555555">1 in 3</text>
<rect x="278" y="64" width="44" height="17" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="300" y="77" font-size="11" fill="#555555">1 in 3</text>
<rect x="380" y="64" width="44" height="17" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.8"/>
<text x="402" y="77" font-size="11" fill="#555555">1 in 3</text>
<rect x="30" y="100" width="140" height="30" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="100" y="120" font-size="13" fill="#000000">Car behind door 1</text>
<rect x="230" y="100" width="140" height="30" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="300" y="120" font-size="13" fill="#000000">Car behind door 2</text>
<rect x="430" y="100" width="140" height="30" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="500" y="120" font-size="13" fill="#000000">Car behind door 3</text>
<rect x="20" y="180" width="160" height="30" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="100" y="200" font-size="13" fill="#000000">Host opens 2 or 3</text>
<rect x="220" y="180" width="160" height="30" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="300" y="200" font-size="13" fill="#000000">Host must open 3</text>
<rect x="420" y="180" width="160" height="30" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="500" y="200" font-size="13" fill="#000000">Host must open 2</text>
<rect x="30" y="260" width="140" height="32" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="100" y="281" font-size="13" fill="#000000">Switching loses</text>
<rect x="230" y="260" width="140" height="32" rx="5" fill="#fff0b3" stroke="#000000" stroke-width="2.2"/>
<text x="300" y="281" font-size="13" font-weight="bold" fill="#000000">Switching wins</text>
<rect x="430" y="260" width="140" height="32" rx="5" fill="#fff0b3" stroke="#000000" stroke-width="2.2"/>
<text x="500" y="281" font-size="13" font-weight="bold" fill="#000000">Switching wins</text>
</g>
</svg>
