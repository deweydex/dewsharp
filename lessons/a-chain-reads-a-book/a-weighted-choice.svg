<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="520px" height="282px" viewBox="0 0 520 282" fill="#1f2328" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" role="img" aria-labelledby="weighted-title weighted-desc">
<title id="weighted-title">A weighted choice: the inner dictionary of "the" as four tickets</title>
<desc id="weighted-desc">At the top, the inner dictionary of "the": best 1, worst 1, age 2. Below it, four tickets in a row, numbered 0 to 3. Ticket 0 belongs to best, ticket 1 to worst, and tickets 2 and 3 to age, which are also shaded with lines. An arrow shows that a draw of 2 lands on a ticket of age.</desc>
<!-- a light card of its own: the page shows this picture with <img>, so the ink is fixed and the card keeps it readable in a dark theme -->
<defs>
  <pattern id="age-lines" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#ffffff" />
    <line x1="0" y1="0" x2="0" y2="8" stroke="#c9c9c9" stroke-width="3" />
  </pattern>
  <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328" />
  </marker>
</defs>
<rect x="0" y="0" width="520" height="282" rx="8" fill="#ffffff" />

<!-- the inner dictionary of "the" -->
<text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15px" x="30" y="32">chain["the"]</text>
<rect x="30" y="44" width="200" height="84" fill="#f6f4f0" stroke="#1f2328" stroke-width="1.4" />
<line x1="30" y1="72" x2="230" y2="72" stroke="#1f2328" stroke-width="0.8" />
<line x1="30" y1="100" x2="230" y2="100" stroke="#1f2328" stroke-width="0.8" />
<line x1="160" y1="44" x2="160" y2="128" stroke="#1f2328" stroke-width="0.8" />
<text font-size="15px" x="44" y="63">best</text>
<text font-size="15px" text-anchor="middle" x="195" y="63">1</text>
<text font-size="15px" x="44" y="91">worst</text>
<text font-size="15px" text-anchor="middle" x="195" y="91">1</text>
<text font-size="15px" x="44" y="119">age</text>
<text font-size="15px" text-anchor="middle" x="195" y="119">2</text>
<text font-size="13px" fill="#4a4a4a" x="262" y="78">Each word gets as many tickets</text>
<text font-size="13px" fill="#4a4a4a" x="262" y="96">as its count: 4 tickets in all.</text>

<!-- the draw -->
<text font-size="13px" text-anchor="middle" x="250" y="150">a draw of 2</text>
<line x1="250" y1="156" x2="250" y2="172" stroke="#1f2328" stroke-width="1.6" marker-end="url(#arrow-head)" />

<!-- four tickets, numbered 0 to 3 -->
<rect x="30" y="176" width="80" height="50" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.4" />
<rect x="120" y="176" width="80" height="50" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.4" />
<rect x="210" y="176" width="80" height="50" rx="6" fill="url(#age-lines)" stroke="#1f2328" stroke-width="3" />
<rect x="300" y="176" width="80" height="50" rx="6" fill="url(#age-lines)" stroke="#1f2328" stroke-width="1.4" />
<text font-size="11px" fill="#4a4a4a" text-anchor="middle" x="70" y="192">ticket</text>
<text font-size="11px" fill="#4a4a4a" text-anchor="middle" x="160" y="192">ticket</text>
<text font-size="11px" fill="#4a4a4a" text-anchor="middle" x="250" y="192">ticket</text>
<text font-size="11px" fill="#4a4a4a" text-anchor="middle" x="340" y="192">ticket</text>
<text font-size="20px" font-weight="bold" text-anchor="middle" x="70" y="216">0</text>
<text font-size="20px" font-weight="bold" text-anchor="middle" x="160" y="216">1</text>
<text font-size="20px" font-weight="bold" text-anchor="middle" x="250" y="216">2</text>
<text font-size="20px" font-weight="bold" text-anchor="middle" x="340" y="216">3</text>

<!-- which word holds each ticket -->
<text font-size="15px" text-anchor="middle" x="70" y="250">best</text>
<text font-size="15px" text-anchor="middle" x="160" y="250">worst</text>
<path d="M 214 236 L 214 244 L 376 244 L 376 236" fill="none" stroke="#1f2328" stroke-width="1.2" />
<text font-size="15px" text-anchor="middle" x="295" y="266">age</text>
</svg>
