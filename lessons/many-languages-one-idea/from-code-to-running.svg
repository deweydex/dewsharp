<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 482" width="680" height="482" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Five ways a program gets from its text to running</title>
<desc id="d">Five rows. The first BASIC at Dartmouth: a compiler translates all the code first, then the machine instructions run. BASIC on a home computer: an interpreter reads a line, does it, and reads the next. Python: the code is compiled to simpler instructions, and an interpreter runs those. JavaScript in Chrome: an interpreter starts running the code, and while it runs, the busiest parts are compiled to machine instructions. C#: a compiler checks all the code, then makes IL; the .NET runtime makes machine code just before each part runs. On this page, the .NET runtime interprets the IL instead.</desc>
<rect x="0" y="0" width="680" height="482" fill="#ffffff"/>
<text x="16" y="30" font-size="13" font-weight="bold" fill="#000000">A compiler: the first BASIC, at Dartmouth</text>
<rect x="16" y="40" width="96" height="48" rx="6" fill="#e8eef8" stroke="#000000" stroke-width="1.3"/>
<text x="64.0" y="68.5" font-size="12.5" text-anchor="middle" fill="#000000">your code</text>
<line x1="116" y1="64" x2="134" y2="64" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="138,64 131,67 131,60" fill="#000000"/>
<rect x="142" y="40" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="265.0" y="68.5" font-size="12.5" text-anchor="middle" fill="#000000">compiler: translates it all first</text>
<line x1="392" y1="64" x2="410" y2="64" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="414,64 407,67 407,60" fill="#000000"/>
<rect x="418" y="40" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="541.0" y="68.5" font-size="12.5" text-anchor="middle" fill="#000000">machine instructions, then run</text>
<text x="16" y="120" font-size="13" font-weight="bold" fill="#000000">An interpreter: BASIC on a home computer of the 1980s</text>
<rect x="16" y="130" width="96" height="48" rx="6" fill="#e8eef8" stroke="#000000" stroke-width="1.3"/>
<text x="64.0" y="158.5" font-size="12.5" text-anchor="middle" fill="#000000">your code</text>
<line x1="116" y1="154" x2="134" y2="154" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="138,154 131,157 131,150" fill="#000000"/>
<rect x="142" y="130" width="522" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="403.0" y="158.5" font-size="12.5" text-anchor="middle" fill="#000000">interpreter: reads a line, does it, reads the next</text>
<text x="16" y="210" font-size="13" font-weight="bold" fill="#000000">Python</text>
<rect x="16" y="220" width="96" height="48" rx="6" fill="#e8eef8" stroke="#000000" stroke-width="1.3"/>
<text x="64.0" y="248.5" font-size="12.5" text-anchor="middle" fill="#000000">your code</text>
<line x1="116" y1="244" x2="134" y2="244" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="138,244 131,247 131,240" fill="#000000"/>
<rect x="142" y="220" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="265.0" y="248.5" font-size="12.5" text-anchor="middle" fill="#000000">compiled to simpler instructions</text>
<line x1="392" y1="244" x2="410" y2="244" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="414,244 407,247 407,240" fill="#000000"/>
<rect x="418" y="220" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="541.0" y="248.5" font-size="12.5" text-anchor="middle" fill="#000000">an interpreter runs those</text>
<text x="16" y="300" font-size="13" font-weight="bold" fill="#000000">JavaScript in Chrome</text>
<rect x="16" y="310" width="96" height="48" rx="6" fill="#e8eef8" stroke="#000000" stroke-width="1.3"/>
<text x="64.0" y="338.5" font-size="12.5" text-anchor="middle" fill="#000000">your code</text>
<line x1="116" y1="334" x2="134" y2="334" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="138,334 131,337 131,330" fill="#000000"/>
<rect x="142" y="310" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="265.0" y="338.5" font-size="12.5" text-anchor="middle" fill="#000000">an interpreter starts running it</text>
<line x1="392" y1="334" x2="410" y2="334" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="414,334 407,337 407,330" fill="#000000"/>
<rect x="418" y="310" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="541.0" y="331.0" font-size="12.5" text-anchor="middle" fill="#000000">while it runs, the busiest parts</text>
<text x="541.0" y="347.0" font-size="12.5" text-anchor="middle" fill="#000000">are compiled to machine instructions</text>
<text x="16" y="390" font-size="13" font-weight="bold" fill="#000000">C#</text>
<rect x="16" y="400" width="96" height="48" rx="6" fill="#e8eef8" stroke="#000000" stroke-width="1.3"/>
<text x="64.0" y="428.5" font-size="12.5" text-anchor="middle" fill="#000000">your code</text>
<line x1="116" y1="424" x2="134" y2="424" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="138,424 131,427 131,420" fill="#000000"/>
<rect x="142" y="400" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="265.0" y="421.0" font-size="12.5" text-anchor="middle" fill="#000000">compiler: checks it all,</text>
<text x="265.0" y="437.0" font-size="12.5" text-anchor="middle" fill="#000000">then makes IL</text>
<line x1="392" y1="424" x2="410" y2="424" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="414,424 407,427 407,420" fill="#000000"/>
<rect x="418" y="400" width="246" height="48" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.3"/>
<text x="541.0" y="421.0" font-size="12.5" text-anchor="middle" fill="#000000">.NET runtime: makes machine code</text>
<text x="541.0" y="437.0" font-size="12.5" text-anchor="middle" fill="#000000">just before each part runs</text>
<text x="16" y="468" font-size="12.5" font-style="italic" fill="#000000">On this page, the .NET runtime interprets the IL, in place of making machine code.</text>
</svg>
