<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640px" height="344px" fill="#1f2328" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">A class diagram of the Red Plains mission</title>
  <desc id="diagram-desc">Six boxes in two rows. Top row: Rover, with the fields Name, SteepestSlope and crew and the methods Climb and Board, is joined to CrewMember by a line marked "up to 3". CrewMember, with the fields Name and Role and no methods yet, is joined to the enum Role by a line marked "one". Role lists Commander, Geologist and Engineer. Bottom row: Log, with the field drives and the methods Add, Longest and SamplesWithIce, is joined to Drive by a line marked "many". Drive, with the fields RoverName, Distance and samples and the methods Collect and SamplesWithIce, is joined to Sample by a line marked "many". Sample has the fields Name, Depth and HasIce, and no methods yet.</desc>

  <!-- a light card of its own: the page shows this picture with <img>, which can't pass the theme's colour in, so the ink is fixed and the card keeps it readable in a dark theme -->
  <rect x="0" y="0" width="640" height="344" rx="8" fill="#ffffff" />

  <!-- boxes: a header band, the class name, then fields, a line, and methods -->
  <g stroke="#1f2328" stroke-width="1.4">
    <rect x="20" y="20" width="150" height="132" fill="none" />
    <rect x="245" y="20" width="150" height="132" fill="none" />
    <rect x="470" y="20" width="150" height="132" fill="none" />
    <rect x="20" y="192" width="150" height="132" fill="none" />
    <rect x="245" y="192" width="150" height="132" fill="none" />
    <rect x="470" y="192" width="150" height="132" fill="none" />
  </g>
  <g fill="#1f2328" fill-opacity="0.08">
    <rect x="20" y="20" width="150" height="26" />
    <rect x="245" y="20" width="150" height="26" />
    <rect x="470" y="20" width="150" height="26" />
    <rect x="20" y="192" width="150" height="26" />
    <rect x="245" y="192" width="150" height="26" />
    <rect x="470" y="192" width="150" height="26" />
  </g>
  <g stroke="#1f2328" stroke-width="1">
    <line x1="20" y1="46" x2="170" y2="46" />
    <line x1="245" y1="46" x2="395" y2="46" />
    <line x1="470" y1="46" x2="620" y2="46" />
    <line x1="20" y1="218" x2="170" y2="218" />
    <line x1="245" y1="218" x2="395" y2="218" />
    <line x1="470" y1="218" x2="620" y2="218" />
    <line x1="20" y1="105" x2="170" y2="105" />
    <line x1="245" y1="88" x2="395" y2="88" />
    <line x1="20" y1="243" x2="170" y2="243" />
    <line x1="245" y1="277" x2="395" y2="277" />
    <line x1="470" y1="277" x2="620" y2="277" />
  </g>

  <g font-size="14px" font-weight="bold" text-anchor="middle">
    <text x="95" y="38">Rover</text>
    <text x="320" y="38">CrewMember</text>
    <text x="545" y="38">enum Role</text>
    <text x="95" y="210">Log</text>
    <text x="320" y="210">Drive</text>
    <text x="545" y="210">Sample</text>
  </g>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12.5px">
    <text x="30" y="63">Name</text>
    <text x="30" y="80">SteepestSlope</text>
    <text x="30" y="97">crew</text>
    <text x="30" y="122">Climb(slope)</text>
    <text x="30" y="139">Board(member)</text>

    <text x="255" y="63">Name</text>
    <text x="255" y="80">Role</text>

    <text x="480" y="63">Commander</text>
    <text x="480" y="80">Geologist</text>
    <text x="480" y="97">Engineer</text>

    <text x="30" y="235">drives</text>
    <text x="30" y="260">Add(drive)</text>
    <text x="30" y="277">Longest()</text>
    <text x="30" y="294">SamplesWithIce()</text>

    <text x="255" y="235">RoverName</text>
    <text x="255" y="252">Distance</text>
    <text x="255" y="269">samples</text>
    <text x="255" y="294">Collect(sample)</text>
    <text x="255" y="311">SamplesWithIce()</text>

    <text x="480" y="235">Name</text>
    <text x="480" y="252">Depth</text>
    <text x="480" y="269">HasIce</text>
  </g>
  <g font-size="12.5px" font-style="italic" fill-opacity="0.7">
    <text x="255" y="105">nothing yet</text>
    <text x="480" y="294">nothing yet</text>
  </g>

  <!-- lines between classes, with an open arrowhead at the class that is held -->
  <g stroke="#1f2328" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="170" y1="66" x2="244" y2="66" />
    <polyline points="237,61 244,66 237,71" />
    <line x1="395" y1="66" x2="469" y2="66" />
    <polyline points="462,61 469,66 462,71" />
    <line x1="170" y1="238" x2="244" y2="238" />
    <polyline points="237,233 244,238 237,243" />
    <line x1="395" y1="238" x2="469" y2="238" />
    <polyline points="462,233 469,238 462,243" />
  </g>
  <g font-size="12px" text-anchor="middle">
    <text x="207" y="59">up to 3</text>
    <text x="432" y="59">one</text>
    <text x="207" y="231">many</text>
    <text x="432" y="231">many</text>
  </g>
</svg>
