<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="'Helvetica Neue', Inter, system-ui, sans-serif" role="img" aria-labelledby="int-circle-title">
  <title id="int-circle-title">The int values in order around a circle. After 2147483647, one more step gives -2147483648.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4531c"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="518" height="298" rx="8" fill="#f6f4f0" stroke="#e2ddd5" stroke-width="1.5"/>
  <circle cx="260" cy="162" r="100" fill="none" stroke="#5f6b7a" stroke-width="2"/>
  <!-- arrows beside the circle: adding 1 moves up the right side, and down the left side -->
  <path d="M 374.9 202.9 A 122 122 0 0 0 374.9 121.1" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <path d="M 145.1 121.1 A 122 122 0 0 0 145.1 202.9" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text x="398" y="158" font-size="13" fill="#1f2933">0 and the</text>
  <text x="398" y="175" font-size="13" fill="#1f2933">numbers above it</text>
  <text x="122" y="158" font-size="13" fill="#1f2933" text-anchor="end">the numbers</text>
  <text x="122" y="175" font-size="13" fill="#1f2933" text-anchor="end">below 0</text>
  <!-- the points -->
  <circle cx="260" cy="262" r="4.5" fill="#1f2933"/>
  <circle cx="285.9" cy="258.6" r="4.5" fill="#1f2933"/>
  <circle cx="234.1" cy="258.6" r="4.5" fill="#1f2933"/>
  <circle cx="277.4" cy="63.5" r="4.5" fill="#b4531c"/>
  <circle cx="242.6" cy="63.5" r="4.5" fill="#b4531c"/>
  <text x="260" y="286" font-size="14" fill="#1f2933" text-anchor="middle" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">0</text>
  <text x="296" y="280" font-size="14" fill="#1f2933" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">1</text>
  <text x="224" y="280" font-size="14" fill="#1f2933" text-anchor="end" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">-1</text>
  <text x="292" y="57" font-size="14" fill="#1f2933" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">2147483647</text>
  <text x="228" y="57" font-size="14" fill="#1f2933" text-anchor="end" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">-2147483648</text>
  <!-- the step past the largest int -->
  <path d="M 274 55 Q 260 34 246 55" fill="none" stroke="#b4531c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="28" font-size="14" fill="#b4531c" text-anchor="middle" font-weight="600">+ 1</text>
</svg>
