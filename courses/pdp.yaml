title: Programming and Design Principles
code: 5N2927 · QQI Level 5
card: >-
  The C# version of Programming and Design Principles. You write and run
  programs from the first page, in your browser, with nothing to install. At
  the end you build a program with a team.
description: >-
  This is Programming and Design Principles (5N2927), taught in C#. Every page
  has small programs that you can change and run. The code runs in your
  browser, on your own device, so there is nothing to install. Before C# runs a
  program, it checks all of it, and the page shows you what it found.


  The course has three series. First programs is about values and their
  types, decisions, loops, reading what a person types, and reading the
  messages C# gives you. Methods, lists and algorithms is about methods of your
  own, arrays, lists and dictionaries, searching and sorting, testing and
  debugging. Working in a team is how the module is assessed: a program you
  plan, build and release with other people.


  Some parts of the module need Visual Studio, such as the debugger and the
  team project, and those pages give you the steps. The tasks come in two
  worlds, secret messages and pixel art. You choose one on each page.
